<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kids Read For Fun: book reviews and reading recommendations for young readers.">
  <title>Kids Read For Fun | Book Reviews</title>
  <link rel="stylesheet" href="styles.css">
  <script src="blog.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="page-container">
    <header class="site-header">
      <h1>Kids Read For Fun</h1>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#archive">Archive</a>
        <button type="button" id="search-toggle" aria-controls="search-form" aria-expanded="false">Search</button>
      </nav>
      <form class="search-form" id="search-form" role="search" hidden>
        <label for="book-search">Search book reviews</label>
        <input id="book-search" name="q" type="search" placeholder="Search books by title" autocomplete="off">
        <button type="submit">Find book</button>
        <p id="search-message" role="status" aria-live="polite"></p>
      </form>
    </header>

    <main id="main-content">
      <section id="archive" class="book-list" aria-label="Book reviews">
        <article class="book-review" aria-labelledby="magyk-title">
          <div class="book-details">
            <p><time datetime="2022-07-05">July 5, 2022</time></p>
            <p>10–14</p>
            <p>Fantasy</p>
            <p class="rating" aria-label="4 out of 5 stars">★★★★☆</p>
          </div>
          <div class="book-content">
            <h2 id="magyk-title">Septimus Heap Book One: Magyk</h2>
            <img
              class="book-cover"
              src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg"
              alt="Cover of Magyk, the first Septimus Heap book by Angie Sage"
              width="200"
              height="300"
            >
            <p>If you enjoy stories about seventh sons of seventh sons and magyk, this is the book for you.</p>
          </div>
        </article>
      </section>
    </main>

    <footer class="site-footer" id="about">
      <p>Brandon Pineda · <span id="current-year">2026</span></p>
    </footer>
  </div>
</body>
</html>
