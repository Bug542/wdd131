<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet Mossback Guardian, a fantasy character. Attack to reduce health or level up to grow stronger.">
  <meta name="theme-color" content="#16372e">
  <title>Character Card | Mossback Guardian</title>

  <!-- Social media meta tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mossback Guardian | Character Card">
  <meta property="og:description" content="Meet Mossback Guardian. Attack, level up, and see how the character's stats change!">
  <meta property="og:url" content="https://bug542.github.io/wdd131/charactercard/">
  <meta property="og:image" content="https://bug542.github.io/wdd131/charactercard/images/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Mossback Guardian character in a green forest with the title Character Card">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mossback Guardian | Character Card">
  <meta name="twitter:description" content="Attack, level up, and watch this fantasy character's stats change.">
  <meta name="twitter:image" content="https://bug542.github.io/wdd131/charactercard/images/social-preview.png">

  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-heading">
      <p class="eyebrow">WDD 131 · Unit 04 Prove</p>
      <h1>Character Card</h1>
      <p>Send your hero into battle or help them grow stronger.</p>
    </header>

    <article class="card" aria-labelledby="character-name">
      <img
        id="character-image"
        class="character-image"
        src="images/mossback-guardian.svg"
        alt="Illustration of Mossback Guardian, a forest warrior with a wooden shield and green armor"
        width="800"
        height="550"
      >

      <div class="card-content">
        <p class="character-label">FOREST REALM · HERO</p>
        <h2 id="character-name">Mossback Guardian</h2>
        <p id="character-class" class="character-class">Forest Defender</p>

        <section class="stats" aria-label="Character statistics">
          <div class="stat-line">
            <span>Level</span>
            <strong id="character-level">1</strong>
          </div>
          <div class="stat-line">
            <label for="character-health">Health</label>
            <strong id="health-text">100 / 100</strong>
          </div>
          <progress id="character-health" max="100" value="100">100%</progress>
        </section>

        <p id="status" class="status" role="status" aria-live="polite">Ready for adventure.</p>

        <div class="buttons">
          <button id="attack-button" type="button">Attack −20 HP</button>
          <button id="level-button" type="button">Level Up +1</button>
        </div>
        <button id="reset-button" class="reset-button" type="button">Reset Character</button>
      </div>
    </article>

    <footer>
      <p>WDD 131 · Web Dynamic Fundamentals</p>
    </footer>
  </main>
</body>
</html>
