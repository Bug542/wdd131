
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive menu practice for WDD 131">
  <title>Responsive Menu</title>
  <link rel="stylesheet" href="styles.css">
  <script src="menu.js" defer></script>
</head>
<body>
  <header>
    <h1>Responsive Menu</h1>
    <button id="menu-button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="main-nav">☰ Menu</button>
    <nav id="main-nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Welcome to My Website</h2>
    <p>This page demonstrates a responsive navigation menu using HTML, CSS, and JavaScript.</p>
  </main>

  <footer>
    <p>WDD 131 - Responsive Menu Practice</p>
  </footer>
</body>
</html>
